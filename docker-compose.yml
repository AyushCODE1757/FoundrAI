version: "3.8"

services:
  backend:
    build: ./backend
    container_name: foundrai2_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - chroma_data:/app/chroma_data # persist ChromaDB across restarts
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # This tells the Next.js frontend where to send API requests
        # If deploying to the cloud, change localhost to your server's IP/Domain
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: foundrai2_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data: # named volume — survives container restarts


